<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#4f6885">
  <title>RitaQ© | Acceso</title>
  <link rel="stylesheet" href="css/ritaq.css">
</head>

<body class="pagina-acceso">
  <main class="ritaq-shell">

    <header class="cabecera-ritaq">
      <img src="assets/RitaQ.png" alt="RitaQ© · LifeLearning Consultoría" class="logo-ritaq">
      <div class="titulo-sistema">
        Sistema de Aseguramiento y Gestión de la Calidad
      </div>
    </header>

    <section class="zona-acceso" aria-labelledby="tituloAcceso">
      <div class="titulo-bloque">
        <h1 id="tituloAcceso">Acceso RitaQ©</h1>
      </div>

      <form id="formLogin" class="form-acceso" autocomplete="on" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            name="usuario"
            type="text"
            autocomplete="username"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Código de usuario"
            required
          >
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="password-box">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Contraseña"
              required
            >
            <button id="btnMostrar" class="btn-ver" type="button" aria-label="Mostrar contraseña">VER</button>
          </div>
        </div>

        <div id="mensajeLogin" class="mensaje-login" role="status" aria-live="polite"></div>

        <div class="acciones">
          <button id="btnEntrar" class="btn-entrar" type="submit">ENTRAR</button>
        </div>
      </form>
    </section>

    <footer class="pie-ritaq">
      <span>RitaQ©</span>
      <span class="punto">·</span>
      <span>LifeLearning Consultoría</span>
    </footer>

  </main>

  <script src="config/usuarios.js"></script>
  <script src="js/actividad.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
