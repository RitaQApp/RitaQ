<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>RitaQ© | Acceso</title>
  <link rel="stylesheet" href="css/ritaq.css">
</head>
<body>
  <main class="acceso-shell">
    <section class="marca" aria-label="RitaQ">
      <img src="assets/RitaQ.png" alt="RitaQ© · LifeLearning Consultoría" class="marca-imagen">
      <p class="marca-subtitulo">Sistema de Aseguramiento y Gestión de la Calidad</p>
    </section>

    <section class="tarjeta-login" aria-labelledby="tituloAcceso">
      <div class="cabecera-login">
        <span class="linea-cian" aria-hidden="true"></span>
        <h1 id="tituloAcceso">Acceso a RitaQ©</h1>
        <p>Introduzca sus credenciales para acceder a su entorno.</p>
      </div>

      <form id="formLogin" class="form-login" autocomplete="on" novalidate>
        <label for="usuario">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          autocomplete="username"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Código de usuario"
          required
        >

        <label for="password">Contraseña</label>
        <div class="campo-password">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Contraseña"
            required
          >
          <button id="btnMostrar" class="mostrar-password" type="button" aria-label="Mostrar contraseña">VER</button>
        </div>

        <div id="mensajeLogin" class="mensaje-login" role="status" aria-live="polite"></div>

        <button id="btnEntrar" class="btn-entrar" type="submit">ENTRAR</button>
      </form>
    </section>
  </main>

  <footer class="pie-pagina">
    <span>RitaQ©</span>
    <span class="separador">·</span>
    <span>LifeLearning Consultoría</span>
  </footer>

  <script src="config/usuarios.js"></script>
  <script src="js/actividad.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
