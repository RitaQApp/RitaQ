<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0b4f70">
  <title>RitaQ© | Acceso</title>
  <link rel="stylesheet" href="css/ritaq.css">
</head>
<body class="login-page">

  <main class="login-layout">

    <section class="brand-panel" aria-label="RitaQ">
      <div class="brand-content">
        <img
          class="brand-logo"
          src="assets/RitaQ_transparente.png"
          alt="RitaQ© · LifeLearning Consultoría"
        >
        <span class="accent-line" aria-hidden="true"></span>
        <p class="brand-subtitle">Sistema de Aseguramiento<br>y Gestión de la Calidad</p>
        <p class="brand-acronym">SAGC</p>
      </div>

      <div class="brand-footer">RitaQ© · LifeLearning Consultoría</div>
    </section>

    <section class="access-panel">
      <div class="access-wrap">
        <div class="access-heading">
          <div class="product-name">RitaQ©</div>
          <h1>Acceso</h1>
          <span class="access-line" aria-hidden="true"></span>
        </div>

        <form id="formLogin" class="login-form" autocomplete="on" novalidate>
          <div class="field">
            <label for="usuario">Usuario</label>
            <div class="empresa-select" id="empresaSelect">
              <input id="usuario" name="usuario" type="hidden" value="">
              <button id="empresaTrigger" class="empresa-trigger" type="button"
                      aria-haspopup="listbox" aria-expanded="false" aria-controls="empresaOpciones"
                      aria-label="Usuario: seleccionar empresa">
                <span id="empresaActual" class="empresa-actual empresa-placeholder">Seleccione su empresa</span>
                <span class="empresa-flecha" aria-hidden="true">▾</span>
              </button>
              <div id="empresaOpciones" class="empresa-opciones" role="listbox"
                   aria-label="Empresas y usuarios autorizados" hidden></div>
            </div>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Contraseña"
                required
              >
              <button id="btnMostrar" class="show-password" type="button"
                      aria-label="Mostrar contraseña">VER</button>
            </div>
          </div>

          <div id="mensajeLogin" class="mensaje-login" role="status" aria-live="polite"></div>

          <button id="btnEntrar" class="login-button" type="submit">ENTRAR</button>

          <p class="restricted">Acceso reservado a usuarios autorizados</p>
        </form>
      </div>

      <footer class="mobile-footer">RitaQ© · LifeLearning Consultoría</footer>
    </section>

  </main>

  <script src="config/usuarios.js"></script>
  <script src="data/maestro_clientes.js"></script>
  <script src="js/actividad.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
