<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#156082">
  <title>RitaQ© | Acceso</title>
  <link rel="stylesheet" href="css/ritaq.css">
</head>
<body class="pagina-acceso">
  <main class="login-layout">
    <section class="brand-panel" aria-label="RitaQ©">
      <div class="brand-content">
        <img src="assets/RitaQ.png" alt="RitaQ© · LifeLearning Consultoría" class="brand-logo">
        <span class="brand-rule" aria-hidden="true"></span>
        <p class="brand-system">Sistema de Aseguramiento<br>y Gestión de la Calidad</p>
        <p class="brand-acronym">SAGC</p>
      </div>
      <p class="brand-foot">RitaQ© · LifeLearning Consultoría</p>
    </section>

    <section class="access-panel" aria-labelledby="tituloAcceso">
      <div class="access-wrap">
        <header class="access-header">
          <p class="access-kicker">RitaQ©</p>
          <h1 id="tituloAcceso">Acceso</h1>
          <span class="access-rule" aria-hidden="true"></span>
        </header>

        <form id="formLogin" class="login-form" autocomplete="on" novalidate>
          <div class="field-group">
            <label for="usuario">Usuario</label>
            <input
              id="usuario"
              name="usuario"
              type="text"
              autocomplete="username"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Código de usuario"
              required
            >
          </div>

          <div class="field-group">
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Contraseña"
                required
              >
              <button id="btnMostrar" class="password-toggle" type="button" aria-label="Mostrar contraseña">VER</button>
            </div>
          </div>

          <div id="mensajeLogin" class="mensaje-login" role="status" aria-live="polite"></div>

          <button id="btnEntrar" class="btn-entrar" type="submit">ENTRAR</button>
        </form>

        <p class="access-foot">Acceso reservado a usuarios autorizados</p>
      </div>
    </section>
  </main>

  <script src="config/usuarios.js"></script>
  <script src="js/actividad.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
